name: Build Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      id: gradle_build
      run: |
        cd android_tv
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/build-output.log
      continue-on-error: true

    - name: Upload Build Log (Always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-output.log

    - name: Upload APK Artifact
      if: steps.gradle_build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: LK21-Netflix-AndroidTV-APK
        path: android_tv/app/build/outputs/apk/debug/app-debug.apk

    - name: Fail if build failed
      if: steps.gradle_build.outcome != 'success'
      run: exit 1
